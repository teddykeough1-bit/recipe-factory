<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Recipe App</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel to compile React JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeTab, setActiveTab] = useState('create'); 
            const [createPage, setCreatePage] = useState('exhibit'); 
            const [recipes, setRecipes] = useState([]);
            const [apiKey, setApiKey] = useState("");

            // Load saved recipes and API key from the browser's local storage
            useEffect(() => {
                const savedRecipes = localStorage.getItem('familyRecipes');
                const savedKey = localStorage.getItem('anthropicKey');
                if (savedRecipes) setRecipes(JSON.parse(savedRecipes));
                if (savedKey) setApiKey(savedKey);
            }, []);

            // Auto-save recipes and API key whenever they change
            useEffect(() => {
                localStorage.setItem('familyRecipes', JSON.stringify(recipes));
            }, [recipes]);

            useEffect(() => {
                localStorage.setItem('anthropicKey', apiKey);
            }, [apiKey]);

            const addRecipe = (newRecipe) => {
                setRecipes([{ ...newRecipe, id: Date.now(), isFavorite: false }, ...recipes]);
            };

            const toggleFavorite = (id) => {
                setRecipes(recipes.map(r => r.id === id ? { ...r, isFavorite: !r.isFavorite } : r));
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-white shadow-xl relative pb-20">
                    {/* Header */}
                    <header className="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
                        <h1 className="text-xl font-bold text-center">Family Recipes</h1>
                    </header>

                    {/* Main Content Area */}
                    <main className="p-4">
                        {activeTab === 'create' ? (
                            <CreateTab 
                                page={createPage} 
                                setPage={setCreatePage} 
                                recipes={recipes}
                                addRecipe={addRecipe}
                                toggleFavorite={toggleFavorite}
                            />
                        ) : (
                            <ExploreTab 
                                addRecipe={addRecipe} 
                                apiKey={apiKey}
                                setApiKey={setApiKey}
                            />
                        )}
                    </main>

                    {/* Bottom Tab Navigation */}
                    <nav className="fixed bottom-0 max-w-md w-full bg-white border-t flex justify-around p-3 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-10">
                        <button 
                            onClick={() => setActiveTab('create')}
                            className={`flex flex-col items-center w-full py-2 ${activeTab === 'create' ? 'text-blue-600' : 'text-gray-400'}`}
                        >
                            <span className="text-2xl mb-1">📝</span>
                            <span className="text-xs font-bold">Create</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('explore')}
                            className={`flex flex-col items-center w-full py-2 ${activeTab === 'explore' ? 'text-blue-600' : 'text-gray-400'}`}
                        >
                            <span className="text-2xl mb-1">✨</span>
                            <span className="text-xs font-bold">Explore</span>
                        </button>
                    </nav>
                </div>
            );
        }

        // MARK: - Create Tab (Upload & Exhibit Navigation)
        function CreateTab({ page, setPage, recipes, addRecipe, toggleFavorite }) {
            return (
                <div className="animate-fade-in">
                    {/* Sub-page Toggle */}
                    <div className="flex bg-gray-200 rounded-lg p-1 mb-6">
                        <button 
                            onClick={() => setPage('exhibit')}
                            className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${page === 'exhibit' ? 'bg-white shadow text-blue-600' : 'text-gray-600'}`}
                        >
                            Exhibit
                        </button>
                        <button 
                            onClick={() => setPage('upload')}
                            className={`flex-1 py-2 text-sm font-bold rounded-md transition-all ${page === 'upload' ? 'bg-white shadow text-blue-600' : 'text-gray-600'}`}
                        >
                            Upload
                        </button>
                    </div>

                    {page === 'exhibit' ? (
                        <ExhibitPage recipes={recipes} toggleFavorite={toggleFavorite} />
                    ) : (
                        <UploadPage addRecipe={addRecipe} setPage={setPage} />
                    )}
                </div>
            );
        }

        // MARK: - Exhibit Page (Browse, Filter, Search)
        function ExhibitPage({ recipes, toggleFavorite }) {
            const [search, setSearch] = useState("");
            const [activeFilters, setActiveFilters] = useState([]);
            const categories = ["Drinks", "Food", "Snacks", "Dessert", "Mains"];

            const toggleFilter = (category) => {
                setActiveFilters(prev => 
                    prev.includes(category) ? prev.filter(c => c !== category) : [...prev, category]
                );
            };

            const filteredRecipes = recipes.filter(recipe => {
                const matchesSearch = search === "" || recipe.title.toLowerCase().includes(search.toLowerCase());
                const matchesFilter = activeFilters.length === 0 || activeFilters.includes(recipe.category);
                return matchesSearch && matchesFilter;
            });

            return (
                <div className="space-y-4">
                    {/* Search Bar */}
                    <input 
                        type="text" 
                        placeholder="Search recipes..." 
                        value={search}
                        onChange={(e) => setSearch(e.target.value)}
                        className="w-full p-3 rounded-lg border focus:ring-2 focus:ring-blue-500 outline-none shadow-sm"
                    />

                    {/* eBay-Style Filter Toggles */}
                    <div className="flex overflow-x-auto gap-2 pb-2 scrollbar-hide">
                        {categories.map(cat => (
                            <button
                                key={cat}
                                onClick={() => toggleFilter(cat)}
                                className={`px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap border transition-colors ${
                                    activeFilters.includes(cat) 
                                        ? 'bg-blue-600 text-white border-blue-600' 
                                        : 'bg-white text-gray-700 hover:bg-gray-50'
                                }`}
                            >
                                {cat}
                            </button>
                        ))}
                    </div>

                    {/* Recipe List */}
                    <div className="space-y-4 mt-4">
                        {filteredRecipes.length === 0 ? (
                            <div className="text-center text-gray-500 mt-10 p-6 bg-gray-50 rounded-xl border border-dashed">
                                <p className="text-3xl mb-2">🍽️</p>
                                <p>No recipes found.</p>
                            </div>
                        ) : (
                            filteredRecipes.map(recipe => (
                                <div key={recipe.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex justify-between items-start">
                                    <div className="flex-1 pr-4">
                                        <h3 className="font-bold text-gray-800 text-lg leading-tight mb-1">{recipe.title}</h3>
                                        <span className="text-xs font-semibold bg-gray-100 text-gray-600 px-2 py-1 rounded-md inline-block mb-3">
                                            {recipe.category}
                                        </span>
                                        <p className="text-sm text-gray-600 line-clamp-3 whitespace-pre-wrap">{recipe.instructions}</p>
                                    </div>
                                    <button 
                                        onClick={() => toggleFavorite(recipe.id)}
                                        className="text-2xl hover:scale-110 transition-transform active:scale-90"
                                    >
                                        {recipe.isFavorite ? '❤️' : '🤍'}
                                    </button>
                                </div>
                            ))
                        )}
                    </div>
                </div>
            );
        }

        // MARK: - Upload Page
        function UploadPage({ addRecipe, setPage }) {
            const [title, setTitle] = useState("");
            const [category, setCategory] = useState("Mains");
            const [instructions, setInstructions] = useState("");
            const categories = ["Drinks", "Food", "Snacks", "Dessert", "Mains"];

            const handleSave = () => {
                if (!title || !instructions) return;
                addRecipe({ title, category, instructions });
                setPage('exhibit'); 
            };

            return (
                <div className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-4">
                    <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">Recipe Name</label>
                        <input 
                            type="text" 
                            placeholder="E.g., Mom's Lasagna"
                            value={title} 
                            onChange={(e) => setTitle(e.target.value)}
                            className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">Category</label>
                        <select 
                            value={category} 
                            onChange={(e) => setCategory(e.target.value)}
                            className="w-full p-3 border rounded-lg bg-white focus:ring-2 focus:ring-blue-500 outline-none"
                        >
                            {categories.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>
                    </div>

                    <div>
                        <label className="block text-sm font-bold text-gray-700 mb-1">Instructions & Ingredients</label>
                        <textarea 
                            rows="6"
                            placeholder="Write the recipe here..."
                            value={instructions} 
                            onChange={(e) => setInstructions(e.target.value)}
                            className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"
                        ></textarea>
                    </div>

                    <button 
                        onClick={handleSave}
                        disabled={!title || !instructions}
                        className="w-full bg-blue-600 text-white font-bold py-3 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-blue-700 transition-colors"
                    >
                        Save to Exhibit
                    </button>
                </div>
            );
        }

        // MARK: - Explore Tab (Claude 3.5 Sonnet Integration)
        function ExploreTab({ addRecipe, apiKey, setApiKey }) {
            const [prompt, setPrompt] = useState("");
            const [response, setResponse] = useState("");
            const [loading, setLoading] = useState(false);

            const askClaude = async () => {
                if (!apiKey) {
                    setResponse("Error: Please enter your Anthropic API Key first.");
                    return;
                }

                setLoading(true);
                setResponse("");
                try {
                    const systemPrompt = "You are an expert chef. The user will ask for a recipe suggestion. Reply ONLY with the recipe card containing the Title, Ingredients, and Instructions. Keep it clear and concise.";
                    
                    // We use the direct-browser-access header to talk to Anthropic from the frontend
                    const res = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: {
                            "x-api-key": apiKey,
                            "anthropic-version": "2023-06-01",
                            "anthropic-dangerous-direct-browser-access": "true",
                            "content-type": "application/json"
                        },
                        body: JSON.stringify({
                            model: "claude-3-5-sonnet-20241022",
                            max_tokens: 1024,
                            system: systemPrompt,
                            messages: [{ role: "user", content: prompt }]
                        })
                    });

                    const data = await res.json();
                    
                    if (data.error) throw new Error(data.error.message);
                    setResponse(data.content[0].text);
                } catch (err) {
                    setResponse("Error: " + err.message);
                }
                setLoading(false);
            };

            const saveClaudeRecipe = () => {
                addRecipe({
                    title: `✨ ${prompt.slice(0, 25)}${prompt.length > 25 ? '...' : ''}`,
                    category: "Food", 
                    instructions: response
                });
                setResponse("✅ Saved! Go to the Create > Exhibit tab to see it.");
                setPrompt("");
            };

            return (
                <div className="space-y-6">
                    {/* API Key Input */}
                    <div className="bg-orange-50 p-4 rounded-xl border border-orange-200">
                        <label className="block text-sm font-bold text-orange-800 mb-1">Anthropic API Key</label>
                        <input 
                            type="password" 
                            placeholder="sk-ant-api03-..." 
                            value={apiKey}
                            onChange={(e) => setApiKey(e.target.value)}
                            className="w-full p-2 text-sm border border-orange-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none"
                        />
                        <p className="text-xs text-orange-600 mt-2">Required to ask Claude. Stored securely in your browser only.</p>
                    </div>

                    <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm space-y-4">
                        <h2 className="font-bold text-gray-800 text-lg flex items-center gap-2">
                            <span>Ask Claude Sonnet 3.5</span>
                        </h2>
                        
                        <input 
                            type="text" 
                            placeholder="E.g., A low-carb dinner using chicken" 
                            value={prompt}
                            onChange={(e) => setPrompt(e.target.value)}
                            className="w-full p-3 rounded-lg border focus:ring-2 focus:ring-purple-500 outline-none"
                        />
                        
                        <button 
                            onClick={askClaude}
                            disabled={!prompt || loading}
                            className="w-full bg-purple-600 text-white font-bold py-3 rounded-lg disabled:opacity-50 disabled:cursor-not-allowed hover:bg-purple-700 transition-colors"
                        >
                            {loading ? "Chef Claude is typing..." : "Generate Recipe"}
                        </button>
                    </div>

                    {response && (
                        <div className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm mt-4 animate-fade-in space-y-4">
                            <div className="bg-gray-50 p-4 rounded-lg whitespace-pre-wrap text-sm text-gray-800 border font-serif">
                                {response}
                            </div>
                            
                            {!response.startsWith("✅ Saved") && !response.startsWith("Error") && (
                                <button 
                                    onClick={saveClaudeRecipe}
                                    className="w-full border-2 border-purple-600 text-purple-700 font-bold py-3 rounded-lg hover:bg-purple-50 transition-colors"
                                >
                                    Save This to My Cards
                                </button>
                            )}
                        </div>
                    )}
                </div>
            );
        }

        // Render the React App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
